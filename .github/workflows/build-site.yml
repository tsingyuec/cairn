name: Validate and Build cairn

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install site dependencies
        run: pip install -r requirements.txt
      - name: Validate catalog and run regression tests
        run: |
          python scripts/validate.py
          python -m unittest discover -s tests -v
          git diff --check
      - name: Validate Markdown formulas and links
        run: |
          node scripts/check/check_md_math.mjs content
          python site/build_site.py --check
      - name: Build static site
        run: |
          python site/build_site.py
          mkdocs build --strict
          node scripts/check/check_katex.mjs build/site --recursive
      - name: Setup Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload static site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
