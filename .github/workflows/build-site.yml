name: Validate and Build cairn

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install site dependencies
        run: pip install -r requirements.txt
      - name: Validate catalog and run regression tests
        run: |
          python scripts/validate.py
          python -m unittest discover -s tests -v
          git diff --check
      - name: Validate Markdown formulas and links
        run: |
          node scripts/check/check_md_math.mjs content
          python site/build_site.py --check
      - name: Build static site
        run: |
          python site/build_site.py
          mkdocs build --strict
          node scripts/check/check_katex.mjs build/site --recursive
      - name: Upload static site (no automatic deployment)
        uses: actions/upload-artifact@v4
        with:
          name: cairn-site
          path: build/site
